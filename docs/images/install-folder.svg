<text x="474.0" y="156.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e8641c" text-anchor="start" font-weight="700">&lt;- copy this folder here (keep its name)</text>
<path d="M124,128 L124,151 L142,151" fill="none" stroke="#c0c6cc" stroke-width="1.5"/>
