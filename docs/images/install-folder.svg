<path d="M168,166 L168,189 L186,189" fill="none" stroke="#c0c6cc" stroke-width="1.5"/>
<rect x="192" y="212" width="220" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="204.0" y="232.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328" text-anchor="start" font-weight="400">📄 pla_lw_temp_test.lua</text>
<path d="M168,204 L168,227 L186,227" fill="none" stroke="#c0c6cc" stroke-width="1.5"/>
<rect x="192" y="250" width="119" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="204.0" y="270.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328" text-anchor="start" font-weight="400">📄 README.md</text>
<path d="M168,242 L168,265 L186,265" fill="none" stroke="#c0c6cc" stroke-width="1.5"/>
<text x="450.0" y="308.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#59636e" text-anchor="middle" font-weight="400">Then restart PrusaSlicer 3. Flatpak: ~/.var/app/com.prusa3d.PrusaSlicer/config/PrusaSlicer3-dev/lua/</text>
