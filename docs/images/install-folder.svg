<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Where to put the plugin folder">
<rect x="0.5" y="0.5" width="899" height="329" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="450.0" y="38.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="700">Copy the plugin folder into PrusaSlicer 3's lua folder</text>
<rect x="60" y="60" width="183" height="30" rx="6" fill="#e8f1ff" stroke="#0969da" stroke-width="1"/>
<text x="72.0" y="80.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328" text-anchor="start" font-weight="700">📁 PrusaSlicer3-dev</text>
<text x="257.2" y="80.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#59636e" text-anchor="start" font-weight="400">PrusaSlicer 3's data folder (it contains PrusaSlicer.ini)</text>
<rect x="104" y="98" width="64" height="30" rx="6" fill="#e8f1ff" stroke="#0969da" stroke-width="1"/>
<text x="116.0" y="118.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328" text-anchor="start" font-weight="700">📁 lua</text>
<text x="181.6" y="118.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#59636e" text-anchor="start" font-weight="400">plugins live here; create it if it is missing</text>
<path d="M80,90 L80,113 L98,113" fill="none" stroke="#c0c6cc" stroke-width="1.5"/>
<rect x="148" y="136" width="312" height="30" rx="6" fill="#fff4ec" stroke="#e8641c" stroke-width="2"/>
