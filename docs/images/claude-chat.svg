<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Example: asking Claude for a profile">
<rect x="0.5" y="0.5" width="899" height="399" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="450.0" y="36.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="700">Step 5, as a conversation (an example, not a recording)</text>
<rect x="250" y="62" width="620" height="82" rx="14" fill="#e8f1ff"/>
<text x="268.0" y="90.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" text-anchor="start" font-weight="400">Look at this repo and make me a Lightweight PLA filament profile for</text>
<text x="268.0" y="112.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" text-anchor="start" font-weight="400">PrusaSlicer 3 with the 230 °C / 0.43 combo. I have a Prusa CORE One</text>
<text x="268.0" y="134.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" text-anchor="start" font-weight="400">with a 0.4 high-flow nozzle.</text>
<text x="862.0" y="160.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#59636e" text-anchor="end" font-weight="700">you</text>
<rect x="30" y="176" width="640" height="190" rx="14" fill="#fff4ec"/>
<text x="50.0" y="206.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" text-anchor="start" font-weight="400">✓  230 °C is inside the usable range (210-240 °C)</text>
<text x="50.0" y="235.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" text-anchor="start" font-weight="400">✓  Found your printer's Prusament PLA profile</text>
<text x="50.0" y="264.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" text-anchor="start" font-weight="400">✓  Built the profile: multiplier 0.43, fan 30 %, no Z-hop, pressure advance off</text>
<text x="50.0" y="293.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" text-anchor="start" font-weight="400">✓  Checked it in the real slicer: 0 retractions, speed about 49 mm/s</text>
<text x="50.0" y="322.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" text-anchor="start" font-weight="700">?  May I install it in PrusaSlicer 3? (then restart it and pick the filament)</text>
<text x="38.0" y="384.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#e8641c" text-anchor="start" font-weight="700">Claude</text>
</svg>